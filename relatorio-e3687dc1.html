<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{--amarelo:#fed71f;--tinta:#1a1a1a;--creme:#fff8e7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--creme);color:var(--tinta)}
header{background:var(--amarelo);border-bottom:4px solid var(--tinta);padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{height:44px;width:auto}header h1{font-size:18px;margin:0}header p{margin:2px 0 0;font-size:13px;opacity:.75}
main{max-width:1280px;margin:0 auto;padding:16px}
.quadro{border:4px solid var(--tinta);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 0 0 var(--tinta)}
iframe{display:block;width:100%;height:calc(100vh - 140px);min-height:900px;border:0}
.nota{font-size:13px;opacity:.75;margin:14px 4px 0}
@media (max-width:640px){iframe{min-height:1400px}}
</style></head>
<body>
<header><img src="/site-assets/6e965fe93423448b.png" alt="Pato Clean" width="1871" height="905">
<div><h1>Relatório de Anúncios do Google</h1><p>Dados atualizados automaticamente direto do Google Ads</p></div></header>
<main>
<div class="quadro"><iframe src="https://datastudio.google.com/embed/reporting/cfc4250a-639a-459a-908f-c3dfdc7f79a0/page/Y8XDG" title="Relatório Google Ads Pato Clean" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>

</main></body></html>
